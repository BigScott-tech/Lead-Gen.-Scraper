# ═══════════════════════════════════════════════════════════════════════════════
#  Lead Generation Engine — Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# ── Niches ─────────────────────────────────────────────────────────────────────
niches:
  - name: "Tech Startups"
    keywords:
      - "web developer"
      - "software engineer"
      - "full stack developer"
      - "react developer"
      - "node.js developer"
      - "python developer"
      - "hiring developer"
      - "contract developer"
      - "freelance developer"
      - "remote developer"
      - "need a website"
      - "looking for developer"

  - name: "HVAC Services"
    keywords:
      - "AC repair"
      - "furnace service"
      - "HVAC repair"
      - "emergency HVAC"
      - "AC not cooling"
      - "furnace making noise"
      - "no heat"
      - "ductwork"
      - "AC installation"
      - "heating service"

  - name: "Web Development"
    keywords:
      - "web development"
      - "website design"
      - "web design company"
      - "seo services"
      - "digital marketing"
      - "website development"
      - "need website"
      - "build website"
      - "website redesign"

  - name: "E-commerce"
    keywords:
      - "online store"
      - "shopify store"
      - "ecommerce website"
      - "product listings"
      - "dropshipping"
      - "woocommerce"
      - "need ecommerce site"

  - name: "Social Media Marketing"
    keywords:
      - "social media manager"
      - "content creator"
      - "instagram growth"
      - "tiktok marketing"
      - "brand awareness"
      - "social media agency"
      - "smma"
      - "digital marketing agency"

# ── Platforms ──────────────────────────────────────────────────────────────────
platforms:
  - name: "web"
    enabled: true
    search_engine: "duckduckgo"

  - name: "instagram"
    enabled: true
    hashtags:
      - "hvacontario"
      - "hvacillinois"
      - "hvacnewyork"
      - "hiring"
      - "freelance"
      - "startup"
      - "webdevelopment"
      - "digitalnomad"
      - "entrepreneur"
    max_posts: 30
    filter_by_region: true

  - name: "tiktok"
    enabled: true
    hashtags:
      - "hiring"
      - "startup"
      - "smallbusiness"
      - "entrepreneur"
      - "freelance"
      - "webdesign"
      - "digitalmarketing"
    max_videos: 30

  - name: "youtube"
    enabled: true
    search_keywords:
      - "hire web developer"
      - "need website built"
      - "looking for freelancer"
      - "startup looking for"
    max_results: 20

  - name: "twitter"
    enabled: true
    search_keywords:
      - "#hiring"
      - "#nowhiring"
      - "#freelance"
      - "need a developer"
      - "looking for dev"
      - "building a startup"

  - name: "linkedin"
    enabled: true
    search_keywords:
      - "hiring"
      - "looking for"
      - "need developer"
      - "we're recruiting"
      - "open to work"

  - name: "facebook"
    enabled: true
    search_groups: true
    community_search: true

# ── Free/open search intelligence ──────────────────────────────────────────────
# No paid/social APIs are used. Social platforms are discovered with public
# search-engine queries such as:
#   "website developer needed" after:2026-05-10 site:x.com
free_search:
  search_engine: "duckduckgo_html"
  max_queries_per_platform: 12
  rate_limit: 0.5

# ── Optional logged-in browser mode ───────────────────────────────────────────
# This stores Playwright browser profiles locally. Use small batches because
# logged-in automation can trigger account checks if pushed too hard.
browser:
  profile_root: "profiles/browser"
  default_profile: "default"
  min_batch_size: 20
  max_batch_size: 50
  headless: true

lead_intent_terms:
  - "website developer needed"
  - "looking for a web designer"
  - "need help with a website build"
  - "need someone to build my website"
  - "can someone build me a website"
  - "web designer needed"
  - "need a website"
  - "need website built"
  - "looking for web developer"
  - "looking for website designer"
  - "hire web developer"
  - "freelance developer needed"
  - "shopify developer needed"
  - "website redesign needed"

platform_query_terms:
  twitter:
    - "\"looking for a web designer\""
    - "\"need help\" \"website build\""
    - "\"need someone\" \"build my website\""
    - "\"can someone\" \"build me a website\""
    - "\"urgent\" \"website\" (needed OR hiring)"
    - "\"looking for\" \"developer\""
    - "\"need\" \"software developer\""
  instagram:
    - "HVAC contractor"
    - "HVAC services"
    - "#hvacontario"
    - "#hvacillinois"
    - "#hvacnewyork"
  linkedin:
    - "\"HVAC Owner\""
    - "\"Founder\" \"need website\""
    - "\"hiring\" \"developer\""

# ── Region targeting ───────────────────────────────────────────────────────────
regions:
  - "Nigeria"
  - "Africa"
  - "U.S."
  - "United States"
  - "U.K."
  - "United Kingdom"
  - "U.A.E."
  - "Canada"
  - "Australia"
region_filter: []

# ── Time filters ───────────────────────────────────────────────────────────────
time_filters:
  max_age_days: 7
  min_age_minutes: 0

# ── Extraction ─────────────────────────────────────────────────────────────────
extraction:
  extract_emails: true
  extract_phones: true
  extract_company_names: true
  extract_social_profiles: true
  extract_post_links: true
  validate_emails: true
  validate_phones: true

# ── Deduplication ──────────────────────────────────────────────────────────────
deduplication:
  enabled: true
  persistent: true
  sqlite_path: "data/leads.sqlite3"
  duplicate_check_fields:
    - "email"
    - "phone"
    - "social_handle"

# ── Lead scoring ───────────────────────────────────────────────────────────────
scoring:
  minimum_score: 15
  positive_terms:
    "now": 8
    "today": 8
    "this week": 6
    "whatsapp": 8
  negative_terms:
    "tutorial": -15
    "course": -12
    "agency hiring": -8
    "web developer jobs": -30
    "design jobs": -25
    "retweeted": -20
    "retweets": -20
    "hashtag on twitter": -25
    "results on x": -25
    "google web designer": -25
    "we specialize": -20
    "offering web design": -20
    "visit our website": -15
    "twitter support": -25
    "developer platform": -25
    "looking for my next thing": -30
    "job seeker": -25

# ── Scheduling ─────────────────────────────────────────────────────────────────
scheduler:
  enabled: false
  frequency_hours: 24
  start_time: "08:00"

# ── Output ─────────────────────────────────────────────────────────────────────
output:
  format: "csv"
  output_dir: "data"
  filename_pattern: "leads_{timestamp}.csv"
  dedup_history: "data/leads_history.csv"
  search_limit: 15

# ── Human-like behavior (web scraper) ──────────────────────────────────────────
human_behavior:
  use_random_delays: true
  min_delay_seconds: 2
  max_delay_seconds: 8
  rotate_user_agents: true

# ── Telegram bot defaults ──────────────────────────────────────────────────────
bot:
  default_platforms:
    - "web"
    - "instagram"
    - "tiktok"
    - "twitter"
    - "linkedin"
    - "facebook"
    - "youtube"
  default_amount: 50
  default_region: ""

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "scraper.log"
  console_output: true
