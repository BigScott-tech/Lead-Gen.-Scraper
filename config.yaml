# ═══════════════════════════════════════════════════════════════════════════════
#  Lead Generation Engine — Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# ── Niches ─────────────────────────────────────────────────────────────────────
niches:
  - name: "Tech Startups"
    keywords:
      - "web developer"
      - "software engineer"
      - "full stack developer"
      - "react developer"
      - "node.js developer"
      - "python developer"
      - "hiring developer"
      - "contract developer"
      - "freelance developer"
      - "remote developer"
      - "need a website"
      - "looking for developer"

  - name: "HVAC Services"
    keywords:
      - "AC repair"
      - "furnace service"
      - "HVAC repair"
      - "emergency HVAC"
      - "AC not cooling"
      - "furnace making noise"
      - "no heat"
      - "ductwork"
      - "AC installation"
      - "heating service"

  - name: "Web Development"
    keywords:
      - "web development"
      - "website design"
      - "web design company"
      - "seo services"
      - "digital marketing"
      - "website development"
      - "need website"
      - "build website"
      - "website redesign"

  - name: "E-commerce"
    keywords:
      - "online store"
      - "shopify store"
      - "ecommerce website"
      - "product listings"
      - "dropshipping"
      - "woocommerce"
      - "need ecommerce site"

  - name: "Social Media Marketing"
    keywords:
      - "social media manager"
      - "content creator"
      - "instagram growth"
      - "tiktok marketing"
      - "brand awareness"
      - "social media agency"
      - "smma"
      - "digital marketing agency"

# ── Platforms ──────────────────────────────────────────────────────────────────
platforms:
  - name: "web"
    enabled: true
    search_engine: "duckduckgo"

  - name: "instagram"
    enabled: true
    hashtags:
      - "hiring"
      - "freelance"
      - "startup"
      - "webdevelopment"
      - "digitalnomad"
      - "entrepreneur"
    max_posts: 30
    filter_by_region: true

  - name: "tiktok"
    enabled: true
    hashtags:
      - "hiring"
      - "startup"
      - "smallbusiness"
      - "entrepreneur"
      - "freelance"
      - "webdesign"
      - "digitalmarketing"
    max_videos: 30

  - name: "youtube"
    enabled: true
    search_keywords:
      - "hire web developer"
      - "need website built"
      - "looking for freelancer"
      - "startup looking for"
    max_results: 20

  - name: "twitter"
    enabled: true
    search_keywords:
      - "#hiring"
      - "#nowhiring"
      - "#freelance"
      - "need a developer"
      - "looking for dev"
      - "building a startup"

  - name: "linkedin"
    enabled: true
    search_keywords:
      - "hiring"
      - "looking for"
      - "need developer"
      - "we're recruiting"
      - "open to work"

  - name: "facebook"
    enabled: true
    search_groups: true
    community_search: true

# ── RapidAPI ───────────────────────────────────────────────────────────────────
# Get your free key at https://rapidapi.com
# One key works for all platforms below.
# Leave blank to use free fallback scrapers (less reliable).
rapidapi:
  key_env: "RAPIDAPI_KEY"           # env var name — do NOT put key here
  timeout: 15
  retry_attempts: 2

  # Host names — these are the RapidAPI marketplace endpoints.
  # They may change over time; verify at rapidapi.com if a platform stops working.
  hosts:
    instagram: "instagram-scraper-api2.p.rapidapi.com"
    twitter:   "twitter241.p.rapidapi.com"
    linkedin:  "linkedin-data-api.p.rapidapi.com"
    tiktok:    "tiktok-api23.p.rapidapi.com"
    youtube:   "youtube-v31.p.rapidapi.com"

# ── Region targeting ───────────────────────────────────────────────────────────
regions:
  - "Nigeria"
  - "Africa"
  - "U.S."
  - "United States"
  - "U.K."
  - "United Kingdom"
  - "U.A.E."
  - "Canada"
  - "Australia"
region_filter: []

# ── Time filters ───────────────────────────────────────────────────────────────
time_filters:
  max_age_days: 7
  min_age_minutes: 0

# ── Extraction ─────────────────────────────────────────────────────────────────
extraction:
  extract_emails: true
  extract_phones: true
  extract_company_names: true
  extract_social_profiles: true
  extract_post_links: true
  validate_emails: true
  validate_phones: true

# ── Deduplication ──────────────────────────────────────────────────────────────
deduplication:
  enabled: true
  duplicate_check_fields:
    - "email"
    - "phone"
    - "social_handle"

# ── Scheduling ─────────────────────────────────────────────────────────────────
scheduler:
  enabled: false
  frequency_hours: 24
  start_time: "08:00"

# ── Output ─────────────────────────────────────────────────────────────────────
output:
  format: "csv"
  output_dir: "data"
  filename_pattern: "leads_{timestamp}.csv"
  dedup_history: "data/leads_history.csv"
  search_limit: 15

# ── Human-like behavior (web scraper) ──────────────────────────────────────────
human_behavior:
  use_random_delays: true
  min_delay_seconds: 2
  max_delay_seconds: 8
  rotate_user_agents: true

# ── Telegram bot defaults ──────────────────────────────────────────────────────
bot:
  default_platforms:
    - "web"
    - "instagram"
    - "tiktok"
    - "twitter"
    - "linkedin"
    - "facebook"
    - "youtube"
  default_amount: 50
  default_region: ""

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "scraper.log"
  console_output: true
